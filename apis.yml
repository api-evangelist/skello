name: Skello
description: 'Skello is a European (French) workforce management SaaS for shift-based
  businesses in retail, hospitality, restaurants, and health. It provides employee
  scheduling and shift planning, time and attendance tracking, absence and leave
  management, labor-cost and legal-compliance controls, team communication, and
  payroll preparation exports. Skello is a Partech portfolio company. As of this
  enrichment pass Skello publishes no public developer API, developer portal, API
  reference, OpenAPI, or status page; integrations are delivered through its own
  partner program rather than a documented public API.'
